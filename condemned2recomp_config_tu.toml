0x8249ECF8 = {name="CanHolsterWeapon"} # CanHolsterWeapon(player, weapon, input): true if the weapon is stowed in the holster instead of dropped
0x823079C8 = {name="GetControlInput"} # GetControlInput(input, "ControlName"): value of a named control, 0 while the player has not unlocked it yet (e.g. "Holster")
